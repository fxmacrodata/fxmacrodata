[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxmacrodata"
version = "1.2.0"
description = "Python client for the FXMacroData API, providing forex macroeconomic data for traders, quants, and analysts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
    { name = "FXMacroData", email = "info@fxmacrodata.com" }
]

keywords = [
    "forex",
    "macro data",
    "macroeconomics",
    "trading",
    "quant",
    "economic indicators",
    "fxmacrodata",
    "rapidapi",
]

dependencies = [
    "requests>=2.28",
    "aiohttp>=3.8"
]

[project.urls]
Homepage = "https://fxmacrodata.com/?utm_source=pypi&utm_medium=package&utm_campaign=python_sdk"
Documentation = "https://fxmacrodata.com/api/docs?utm_source=pypi&utm_medium=package&utm_campaign=python_sdk"
Source = "https://github.com/fxmacrodata/fxmacrodata"
Issues = "https://github.com/fxmacrodata/fxmacrodata"

[project.optional-dependencies]
openbb = [
    "openbb-core>=1.0",
]
workspace = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
dev = [
    "fastapi>=0.100",
    "httpx>=0.24",
    "httpx2>=2.0",
    "openbb-core>=1.0",
    "openbb-platform-api>=1.3.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.10",
    "python-dotenv>=1.1",
    "python-semantic-release>=7.23",
    "twine>=4.0",
    "build>=1.0",
    "ruff>=0.0",
    "mypy>=1.5",
    "black>=24.0",
    # type stubs for static type checking
    "types-requests>=2.28",
    "uvicorn>=0.23",
]

[project.scripts]
fxmacrodata-openbb-backend = "fxmacrodata.openbb.workspace_backend:main"

[project.entry-points."openbb_core_extension"]
fxmacrodata = "fxmacrodata.openbb.router:router"

[project.entry-points."openbb_provider_extension"]
fxmacrodata = "fxmacrodata.openbb:fxmacrodata_provider"

[tool.setuptools.packages.find]
where = ["."]
include = ["fxmacrodata*"]

[tool.setuptools]
include-package-data = true

[tool.black]
target-version = ["py39"]
