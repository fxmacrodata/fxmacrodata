name: PR Validation

on:
  pull_request:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check fxmacrodata tests

      - name: Check formatting with Black
        run: python -m black --check fxmacrodata tests

      - name: Type check with Mypy
        run: python -m mypy fxmacrodata

      - name: Run test suite
        env:
          FXMACRODATA_API_KEY: ${{ secrets.FXMACRODATA_API_KEY }}
        run: python -m pytest tests -q

      - name: Build package distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Smoke-test OpenBB entry points
        run: |
          python - <<'PY'
          from importlib.metadata import entry_points

          from fxmacrodata.openbb import fxmacrodata_provider
          from fxmacrodata.openbb.workspace_backend import _apps_json, _widgets_json

          core_eps = entry_points(group="openbb_core_extension")
          provider_eps = entry_points(group="openbb_provider_extension")

          assert any(ep.name == "fxmacrodata" for ep in core_eps)
          assert any(ep.name == "fxmacrodata" for ep in provider_eps)
          assert fxmacrodata_provider is not None
          assert fxmacrodata_provider.name == "fxmacrodata"
          assert "FXMacroDataDataCatalogue" in fxmacrodata_provider.fetcher_dict
          assert "fxmacrodata_catalogue" in _widgets_json()
          assert _apps_json()
          PY
